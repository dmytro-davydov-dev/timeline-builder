<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Body Map — Medical Timeline</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0b0c2a; --navy2:#12143f; --indigo:#4338ca; --indigo2:#6d5ef5;
    --blue:#2f6fed; --ink:#14152b; --sub:#5b5d78; --line:#e6e6ef; --bg:#f6f6fb; --card:#fff;
    --em:#2f6fed; --pt:#0e9f6e; --ortho:#7c3aed; --rad:#d97706; --im:#0891b2; --other:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  header .brand{display:flex;align-items:center;gap:10px;}
  header .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--indigo2);}
  header h1{font-size:16px;margin:0;font-weight:700;}
  header .sub{font-size:11.5px;color:#b7b8dd;margin-top:1px;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;padding:8px 12px;border-radius:8px;font-size:12.5px;cursor:pointer;}
  .btn:hover{background:rgba(255,255,255,.14);}
  #fileInput{display:none;}

  .stats-bar{display:flex;gap:14px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .stat-card{flex:1;min-width:120px;background:var(--bg);border-radius:10px;padding:10px 12px;}
  .stat-card b{font-size:19px;color:var(--navy);display:block;}
  .stat-card span{font-size:11px;color:var(--sub);}

  .toolbar2{display:flex;gap:10px;align-items:center;padding:12px 24px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);}
  input[type=text],input[type=date]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;}
  #searchBox{flex:1;min-width:180px;}
  label.mini{font-size:11px;color:var(--sub);display:block;margin-bottom:2px;}
  .seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;}
  .seg button{border:none;background:transparent;padding:6px 12px;font-size:12px;font-weight:600;color:var(--sub);border-radius:6px;cursor:pointer;}
  .seg button.active{background:var(--navy);color:#fff;}

  .layout{display:grid;grid-template-columns:340px 1fr;gap:0;}
  .mappane{padding:20px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;background:#fff;}
  .figure-wrap{position:relative;width:280px;}
  .hotspot{position:absolute;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:800;transition:transform .12s;}
  .hotspot:hover{transform:translate(-50%,-50%) scale(1.15);}
  .hotspot.selected{outline:3px solid var(--navy);outline-offset:2px;}
  .legend-mini{margin-top:14px;font-size:11px;color:var(--sub);text-align:center;line-height:1.6;}
  .other-findings{margin-top:16px;width:100%;}
  .other-findings h4{font-size:11px;text-transform:uppercase;color:var(--sub);margin:0 0 6px;letter-spacing:.5px;}
  .of-chip{display:inline-block;background:var(--bg);border:1px solid var(--line);padding:4px 9px;border-radius:20px;font-size:11px;margin:0 5px 5px 0;cursor:pointer;}
  .of-chip.selected{background:var(--indigo);color:#fff;border-color:var(--indigo);}

  .detailpane{padding:20px 26px 60px;}
  .empty-hint{color:var(--sub);font-size:13px;text-align:center;padding:80px 20px;}
  .empty-hint b{display:block;font-size:15px;color:var(--navy);margin-bottom:6px;}
  .sel-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .sel-head h2{font-size:20px;margin:0;color:var(--navy);}
  .sel-head span{font-size:12px;color:var(--sub);background:var(--bg);padding:4px 10px;border-radius:20px;}
  .med-chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px;}
  .med-chip{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);cursor:pointer;color:var(--sub);}
  .med-chip.active{color:#fff;border-color:transparent;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .card .row1{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .card .prov{font-weight:700;font-size:13px;}
  .card .fac{font-size:11.5px;color:var(--sub);}
  .tag{display:inline-block;font-size:10px;font-weight:700;color:#fff;padding:2px 8px;border-radius:6px;}
  .summary{font-size:12.5px;line-height:1.55;color:#33344d;margin-top:8px;white-space:pre-line;}
  .pdf-link{font-size:11.5px;color:var(--blue);text-decoration:none;font-weight:600;margin-top:8px;display:inline-block;}
  @media(max-width:820px){.layout{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand"><span class="dot"></span><h1>Caldwell — Medical Timeline</h1></div>
    <div class="sub">Body Map · injury-centric view</div>
  </div>
  <div class="actions">
    <button class="btn" onclick="document.getElementById('fileInput').click()">⇪ Load different Excel</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls">
    <button class="btn">⇩ Export PDF</button>
    <button class="btn">⇩ Export PPT</button>
  </div>
</header>

<div class="stats-bar" id="statsBar"></div>

<div class="toolbar2">
  <input type="text" id="searchBox" placeholder="Search within selected body part...">
  <div>
    <label class="mini">Date of loss</label>
    <input type="date" id="accidentDate">
  </div>
  <div class="seg" id="viewSeg">
    <button class="active" data-v="front">Front view</button>
    <button data-v="back">Back view</button>
  </div>
</div>

<div class="layout">
  <div class="mappane">
    <div class="figure-wrap">
      <svg viewBox="0 0 280 560" width="280" height="560">
        <g fill="#dfe3f0" stroke="#c7cce3" stroke-width="1.5">
          <circle cx="140" cy="42" r="30"/>
          <rect x="115" y="70" width="50" height="22" rx="8"/>
          <path d="M90,92 Q140,78 190,92 L200,220 Q140,250 80,220 Z"/>
          <rect x="55" y="100" width="26" height="140" rx="13"/>
          <rect x="199" y="100" width="26" height="140" rx="13"/>
          <rect x="45" y="235" width="24" height="60" rx="11"/>
          <rect x="211" y="235" width="24" height="60" rx="11"/>
          <circle cx="57" cy="300" r="12"/>
          <circle cx="223" cy="300" r="12"/>
          <rect x="105" y="215" width="70" height="90" rx="14"/>
          <rect x="103" y="300" width="32" height="150" rx="14"/>
          <rect x="145" y="300" width="32" height="150" rx="14"/>
          <rect x="98" y="445" width="34" height="70" rx="12"/>
          <rect x="148" y="445" width="34" height="70" rx="12"/>
          <ellipse cx="115" cy="530" rx="20" ry="10"/>
          <ellipse cx="165" cy="530" rx="20" ry="10"/>
        </g>
      </svg>
      <div id="hotspotLayer"></div>
    </div>
    <div class="legend-mini">Bubble size = number of encounters<br>Color = most common care type for that area</div>
    <div class="other-findings" id="otherFindings"></div>
  </div>

  <div class="detailpane" id="detailPane">
    <div class="empty-hint"><b>Click a body part to explore</b>Bubble size shows how many encounters mention that area. Select one to see its full chronological history.</div>
  </div>
</div>

<script>
const MED_COLORS = {'Emergency Medicine':'#2f6fed','Physical Therapy':'#0e9f6e','Orthopedic':'#7c3aed','Radiology':'#d97706','Internal Medicine':'#0891b2','Anesthesiology':'#db2777','Family Medicine':'#65a30d'};
function medColor(m){ return MED_COLORS[m] || '#64748b'; }
function escapeHtml(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// approximate hotspot coordinates on the 280x560 stylized figure
const COORDS = {
  'Head':[140,38],'Face':[140,50],'Eye':[150,44],'Ear':[164,46],'Nose':[140,52],'Mouth':[140,58],'Sinuses':[132,44],
  'Neck':[140,82],'Shoulder':[192,100],'Upper Arm':[204,150],'Arm':[210,180],'Elbow':[212,205],'Forearm':[214,235],
  'Wrist':[219,262],'Hand':[223,290],'Finger':[223,305],'Chest':[140,140],'Lungs':[120,145],'Heart':[155,150],
  'Armpit':[178,120],'Abdomen':[140,270],'Stomach':[125,265],'Intestines':[140,285],'Genitals':[140,300],
  'Leg':[119,380],'Upper Back':[140,120],'Back':[140,180],'Spine':[140,200],'Foot':[115,515],'Toe':[115,535]
};
const BACK_ONLY = new Set(['Back','Upper Back','Spine']);
const FRONT_HIDE = new Set(['Back','Upper Back','Spine']);
const BACK_SHOW = new Set(['Head','Neck','Shoulder','Upper Arm','Arm','Elbow','Forearm','Wrist','Hand','Finger','Back','Upper Back','Spine','Leg','Foot','Toe']);

let EVENTS = [];
let state = { view:'front', selectedPart:null, search:'', medFilter:new Set() };

function normalize(rows){
  return rows.map(r=>{
    const get = (k)=>{
      const key = Object.keys(r).find(x=>x.trim().toLowerCase()===k.toLowerCase());
      return key ? (r[key]===null||r[key]===undefined? '': String(r[key])) : '';
    };
    const dateStr = get('Encounter Date');
    let d = new Date(dateStr);
    if(isNaN(d)) d = new Date(0);
    return {
      date:d, dateStr,
      provider:get('Primary Provider')||'Unknown',
      facility:get('Facility')||'Unknown facility',
      bodyParts:(get('Body Parts')||'').split(',').map(s=>s.trim()).filter(Boolean),
      medType:get('Medicine Type')||'Other',
      recordType:get('Record Type')||'Record',
      summary:get('Summary')||'',
      hasPdf: !!get('Link To Pdf')
    };
  }).filter(e=>e.dateStr && e.date.getTime()).sort((a,b)=>a.date-b.date);
}

function loadData(rows){
  EVENTS = normalize(rows);
  state.selectedPart = null; state.medFilter = new Set();
  renderStats();
  renderHotspots();
  renderDetail();
}

document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const wb = XLSX.read(ev.target.result, {type:'binary'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    loadData(rows);
  };
  reader.readAsBinaryString(file);
});

document.querySelectorAll('#viewSeg button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#viewSeg button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); state.view = b.dataset.v; renderHotspots();
  });
});
document.getElementById('accidentDate').addEventListener('change', renderDetail);
document.getElementById('searchBox').addEventListener('input', e=>{ state.search=e.target.value.toLowerCase(); renderDetail(); });

function partCounts(){
  const counts = {}, medByPart = {};
  EVENTS.forEach(e=>{
    e.bodyParts.forEach(bp=>{
      counts[bp] = (counts[bp]||0)+1;
      medByPart[bp] = medByPart[bp]||{};
      medByPart[bp][e.medType] = (medByPart[bp][e.medType]||0)+1;
    });
  });
  return {counts, medByPart};
}

function dominantMed(medByPart, part){
  const m = medByPart[part]; if(!m) return 'Other';
  return Object.entries(m).sort((a,b)=>b[1]-a[1])[0][0];
}

function renderHotspots(){
  const {counts, medByPart} = partCounts();
  const layer = document.getElementById('hotspotLayer');
  const known = Object.keys(counts).filter(p=>COORDS[p]);
  const unknown = Object.keys(counts).filter(p=>!COORDS[p]);

  const visible = known.filter(p=> state.view==='back' ? BACK_SHOW.has(p) : !FRONT_HIDE.has(p));
  layer.innerHTML = visible.map(p=>{
    const [x,y] = COORDS[p];
    const c = counts[p];
    const r = Math.min(26, 9 + Math.sqrt(c)*4);
    const color = medColor(dominantMed(medByPart,p));
    const sel = state.selectedPart===p ? 'selected':'';
    return `<div class="hotspot ${sel}" style="left:${x/280*100}%;top:${y/560*100}%;width:${r*2}px;height:${r*2}px;background:${color};" title="${escapeHtml(p)} — ${c} encounter${c>1?'s':''}" onclick="selectPart('${p.replace(/'/g,"\\'")}')">${c}</div>`;
  }).join('');

  const of = document.getElementById('otherFindings');
  if(unknown.length){
    of.innerHTML = `<h4>Other findings (unmapped)</h4>` + unknown.map(p=>`<span class="of-chip ${state.selectedPart===p?'selected':''}" onclick="selectPart('${p.replace(/'/g,"\\'")}')">${escapeHtml(p)} (${counts[p]})</span>`).join('');
  } else {
    of.innerHTML = '';
  }
}

function selectPart(p){
  state.selectedPart = p; state.medFilter = new Set(); state.search='';
  document.getElementById('searchBox').value='';
  renderHotspots();
  renderDetail();
}

function renderStats(){
  const n = EVENTS.length;
  const span = n? Math.round((EVENTS[n-1].date-EVENTS[0].date)/86400000) : 0;
  const parts = new Set(EVENTS.flatMap(e=>e.bodyParts)).size;
  const provs = new Set(EVENTS.map(e=>e.provider.split(';')[0].trim())).size;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><b>${n}</b><span>Encounters</span></div>
    <div class="stat-card"><b>${span}d</b><span>Treatment span</span></div>
    <div class="stat-card"><b>${parts}</b><span>Body parts noted</span></div>
    <div class="stat-card"><b>${provs}</b><span>Providers</span></div>
  `;
}

function renderDetail(){
  const pane = document.getElementById('detailPane');
  if(!state.selectedPart){
    pane.innerHTML = '<div class="empty-hint"><b>Click a body part to explore</b>Bubble size shows how many encounters mention that area. Select one to see its full chronological history.</div>';
    return;
  }
  let list = EVENTS.filter(e=>e.bodyParts.includes(state.selectedPart));
  const meds = [...new Set(list.map(e=>e.medType))];
  if(state.medFilter.size) list = list.filter(e=>state.medFilter.has(e.medType));
  if(state.search) list = list.filter(e=> (e.summary+' '+e.provider).toLowerCase().includes(state.search));

  const accidentVal = document.getElementById('accidentDate').value;
  const accidentDate = accidentVal ? new Date(accidentVal) : null;

  let html = `<div class="sel-head"><h2>${escapeHtml(state.selectedPart)}</h2><span>${list.length} of ${EVENTS.filter(e=>e.bodyParts.includes(state.selectedPart)).length} encounters</span></div>`;
  html += `<div class="med-chips">` + meds.map(m=>`<span class="med-chip ${state.medFilter.has(m)?'active':''}" style="${state.medFilter.has(m)?`background:${medColor(m)}`:''}" onclick="toggleMed('${m.replace(/'/g,"\\'")}')">${escapeHtml(m)}</span>`).join('') + `</div>`;

  if(!list.length){ html += '<div class="empty-hint">No encounters match these filters.</div>'; pane.innerHTML = html; return; }

  list.forEach(e=>{
    const marker = accidentDate && e.date.toDateString()===accidentDate.toDateString() ? ' ⚑' : '';
    html += `<div class="card">
      <div class="row1">
        <div><div class="prov">${escapeHtml(e.provider)}${marker}</div><div class="fac">${e.date.toLocaleDateString()} · ${escapeHtml(e.facility)}</div></div>
        <span class="tag" style="background:${medColor(e.medType)}">${escapeHtml(e.medType)}</span>
      </div>
      <div class="summary">${escapeHtml(e.summary)}</div>
      ${e.hasPdf?`<a class="pdf-link" href="#" onclick="alert('Would open source PDF.'); return false;">📄 Source PDF</a>`:''}
    </div>`;
  });
  pane.innerHTML = html;
}

function toggleMed(m){
  if(state.medFilter.has(m)) state.medFilter.delete(m); else state.medFilter.add(m);
  renderDetail();
}
